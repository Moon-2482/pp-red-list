<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="theme-color" content="#0b4fd6">
<title>Online Card Rate List</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Archivo,system-ui,-apple-system,'Segoe UI',sans-serif;background:#f4f6f9;color:#14181f}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#083a9e,#0b4fd6)}
.login-card{background:#fff;border-radius:18px;padding:34px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 24px 60px -18px rgba(0,0,0,.4)}
.login-card h1{font-size:26px;color:#083a9e;margin:0 0 4px;font-weight:900;letter-spacing:3px}
.login-card p.sub{font-size:13px;color:#59626f;margin-bottom:20px}
.login-card input{width:100%;font-size:16px;padding:13px 14px;margin-bottom:12px;border:2px solid #dde3ec;border-radius:10px}
.login-card input:focus{outline:none;border-color:#0b4fd6}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:#59626f;margin:2px 0 14px;text-align:left}
.remember input{width:auto;margin:0}
#loginBtn{width:100%;font-size:17px;font-weight:800;padding:14px;background:#0b4fd6;color:#fff;border:none;border-radius:10px;cursor:pointer}
#loginErr{color:#d92d20;font-size:13px;margin-top:10px;min-height:18px}
#app{display:none}
.header{background:linear-gradient(135deg,#083a9e,#0b4fd6);color:#fff;text-align:center;padding:36px 18px 30px}
.biz{font-size:40px;font-weight:900;letter-spacing:6px}
.tagline{font-size:14px;color:#bcd0f5;letter-spacing:1px;margin-top:6px}
.page-title{font-size:24px;font-weight:800;margin-top:20px}
.searchbox{padding:22px 16px 8px;text-align:center}
.searchbox h2{font-size:20px;color:#083a9e;margin-bottom:12px}
.searchrow{display:flex;gap:8px;max-width:440px;margin:0 auto}
#q{flex:1;font-size:20px;padding:13px 14px;border:2px solid #0b4fd6;border-radius:12px;text-align:center;background:#fff;color:#14181f}
#go{font-size:17px;padding:13px 24px;background:#f4630a;color:#fff;border:none;border-radius:12px;cursor:pointer;font-weight:800}
.hint{font-size:12px;color:#59626f;margin-top:10px}
#results{padding:16px 14px 34px;max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:0 10px 28px -12px rgba(10,30,80,.25);border:1px solid #dde3ec}
.card img.photo{width:100%;display:block;background:#eceff4}
.nophoto{padding:36px 16px;text-align:center;background:#eceff4;color:#59626f;font-size:14px}
.cardbody{padding:18px}
.cardno{font-size:26px;font-weight:800;color:#083a9e;text-align:center}
.badges{text-align:center;margin-top:6px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;margin:2px 3px}
.badge.variant{background:#fff3e6;color:#d14e06;border:1px solid #f4630a}
.badge.acrylic{background:#083a9e;color:#fff}
.ratebox{margin-top:14px;border-radius:12px;padding:14px 10px;text-align:center;background:linear-gradient(135deg,#f4630a,#d14e06);color:#fff}
.ratebox .amt{font-size:34px;font-weight:900}
.ratebox .lbl{font-size:13px;margin-top:4px;opacity:.95}
.inforow{display:flex;gap:10px;margin-top:10px}
.info{flex:1;background:#f4f6f9;border:1px solid #dde3ec;border-radius:10px;padding:10px;text-align:center}
.info .k{font-size:11px;color:#59626f}
.info .v{font-size:17px;font-weight:700;color:#14181f;margin-top:2px}
.note{margin-top:10px;text-align:center;font-size:13px;color:#083a9e;background:#e8efff;border-radius:8px;padding:9px;font-weight:600}
.notfound{text-align:center;padding:34px 16px;color:#59626f;font-size:16px}
.empty{text-align:center;padding:40px 16px;color:#59626f}
.empty h3{font-size:19px;color:#14181f;margin-bottom:8px}
.footer{text-align:center;font-size:12px;color:#59626f;padding:20px 12px 30px}
#logout{display:block;margin:0 auto;background:none;border:none;color:#59626f;font-size:12px;text-decoration:underline;cursor:pointer;padding:8px}
</style>
</head>
<body>
<div id="gate"><div class="login-card">
<h1>ONLINE</h1><p class="sub">Online Card Rate List — Login</p>

<label class="remember"><input id="rm" type="checkbox" checked> Stay logged in on this device</label>
<button id="loginBtn">Log In</button><div id="loginErr"></div>
</div></div>
<div id="app">
<div class="header">
<div class="biz">ONLINE</div><div class="tagline">Wedding Cards</div>
<div class="page-title">Online Card Rate List</div>
</div>
<div class="searchbox"><h2>Enter a card number</h2>

<div class="hint">All rates are per card</div></div>
<div id="results"><div class="empty"><h3>Check a rate instantly</h3>Type a card number — the card appears below as you type.</div></div>
<button id="logout">Log out</button>
<div class="footer">Online Card Rate List<br>Rates per card</div>
</div>

const AUTH_HASH='91579e06bbc0ca510cf7d8d215d08570c882da17a3ae430eb951f315ab089026';
const LS_KEY='pp_redlist_auth';
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function showApp(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block'}
try{if(localStorage.getItem(LS_KEY)==='1'||sessionStorage.getItem(LS_KEY)==='1'||localStorage.getItem('pp_ratelist_auth')==='1'||sessionStorage.getItem('pp_ratelist_auth')==='1')showApp()}catch(e){}
async function doLogin(){
const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
if(await sha256(u+':'+p)===AUTH_HASH){
try{if(document.getElementById('rm').checked)localStorage.setItem(LS_KEY,'1');else sessionStorage.setItem(LS_KEY,'1')}catch(e){}
document.getElementById('loginErr').textContent='';showApp();
}else{document.getElementById('loginErr').textContent='Wrong username or password. Try again.'}}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('logout').addEventListener('click',()=>{try{localStorage.removeItem(LS_KEY);sessionStorage.removeItem(LS_KEY);localStorage.removeItem('pp_ratelist_auth');sessionStorage.removeItem('pp_ratelist_auth')}catch(e){}location.reload()});
function imgFor(r){if(r.no==='615')return IMGS['615|'+r.variant];return IMGS[r.no]||null}
function render(list){
const box=document.getElementById('results');
if(!list.length){box.innerHTML='<div class="notfound">No card found — check the number and try again.</div>';return}
box.innerHTML=list.map(r=>{
const img=imgFor(r);
const photo=img?'<img class="photo" src="'+img+'" alt="Card '+r.no+'" loading="lazy">':'<div class="nophoto">Photo not available for this card<br><span style="font-size:12px">rate is shown below</span></div>';
const badges=(r.variant?'<span class="badge variant">'+r.variant+'</span>':'')+(r.acrylic?'<span class="badge acrylic">ACRYLIC</span>':'');
const perCard=Math.round(Number(r.rate100)/100);
const innerBox=r.inner?'<div class="info"><div class="k">Inner</div><div class="v">'+r.inner+'</div></div>':'';
const innerRate=r.extra_inner?'<div class="info"><div class="k">Inner Rate</div><div class="v">Rs '+r.extra_inner+'</div></div>':'';
const note=r.note?'<div class="note">'+r.note+'</div>':'';
return '<div class="card">'+photo+'<div class="cardbody"><div class="cardno">Card '+r.no+'</div><div class="badges">'+badges+'</div><div class="ratebox"><div class="amt">Rs '+perCard+'</div><div class="lbl">per card</div></div>'+((innerBox||innerRate)?'<div class="inforow">'+innerBox+innerRate+'</div>':'')+note+'</div></div>'}).join('')}
function search(){
const q=document.getElementById('q').value.replace(/\D/g,'');
const box=document.getElementById('results');
if(!q){box.innerHTML='<div class="empty"><h3>Check a rate instantly</h3>Type a card number — the card appears below as you type.</div>';return}
let list=RATES.filter(r=>r.no===q||r.no.startsWith(q)||r.no.includes(q));
list.sort((a,b)=>(a.no===q?0:1)-(b.no===q?0:1)||a.no.localeCompare(b.no,undefined,{numeric:true}));
render(list)}
document.getElementById('go').addEventListener('click',search);
document.getElementById('q').addEventListener('input',search);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script>
